<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Catálogo de Partituras{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo">🎼 Partituras</a>
      <nav class="site-nav">
        <a href="/">Catálogo</a>
        <a href="/agregar">Agregar Pieza</a>
        <a href="/escanear">Escanear</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <div id="chat-panel" class="chat-panel" style="display:none;">
    <div class="chat-panel-header">
      <span>Asistente de Partituras</span>
      <button onclick="toggleChat()" class="btn-icon" title="Cerrar">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Escribe una pregunta..." class="chat-input" autocomplete="off">
      <button id="chat-send-btn" onclick="sendChat()" class="btn-primary btn-sm">Enviar</button>
    </div>
  </div>

  <button class="chat-fab" onclick="toggleChat()" title="Asistente IA">💬</button>

  {% block chat %}{% endblock %}

  <script src="/static/chat.js"></script>
</body>
</html>
