<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Catálogo de Partituras{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo">🎼 Partituras</a>
      <nav class="site-nav">
        <a href="/">Catálogo</a>
        <a href="/agregar">Agregar Pieza</a>
        <a href="/escanear">Escanear</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <div id="chat-panel" class="chat-panel" style="display:none;">
    <div class="chat-panel-header">
      <span>Asistente</span>
      <button onclick="toggleChat()" class="btn-icon">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Escribe una pregunta..." class="chat-input">
      <button onclick="sendChat()" class="btn-primary">Enviar</button>
    </div>
  </div>

  <button class="chat-fab" onclick="toggleChat()" title="Asistente IA">💬</button>

  {% block chat %}{% endblock %}

  <script>
    function toggleChat() {
      const panel = document.getElementById('chat-panel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
      if (panel.style.display === 'flex') {
        document.getElementById('chat-input').focus();
      }
    }

    async function sendChat() {
      const input = document.getElementById('chat-input');
      const messages = document.getElementById('chat-messages');
      const text = input.value.trim();
      if (!text) return;

      messages.innerHTML += `<div class="chat-msg chat-user">${escapeHtml(text)}</div>`;
      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        const data = await res.json();
        messages.innerHTML += `<div class="chat-msg chat-bot">${escapeHtml(data.reply || data.response || JSON.stringify(data))}</div>`;
      } catch(e) {
        messages.innerHTML += `<div class="chat-msg chat-bot chat-error">Error al conectar con el asistente.</div>`;
      }
      messages.scrollTop = messages.scrollHeight;
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.id === 'chat-input' && e.key === 'Enter') sendChat();
    });

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
